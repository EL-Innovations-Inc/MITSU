[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mitsu-activation"
version = "1.0.1"
description = "MITSU: a symmetric-power activation with NumPy and PyTorch implementations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Evan David Little"}]
keywords = ["activation-function", "pytorch", "neural-networks", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
torch = ["torch>=2.2"]
experiments = [
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "torch>=2.2",
  "matplotlib>=3.8,<4",
]
dev = ["pytest>=8,<10", "scipy>=1.11,<2", "build>=1,<2"]

[tool.setuptools]
py-modules = ["mitsu"]
packages = ["mitsu_torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
